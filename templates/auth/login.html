<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A&D - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">A&amp;D</div>
        <h1 class="login-title">Bienvenido</h1>
        <p class="login-subtitle">Iniciar Sesión</p>
        
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="login-form-group">
                <label for="username" class="login-label">Usuario</label>
                <input type="text" id="username" name="username" class="login-input" placeholder="Ingrese su usuario" required>
            </div>
            
            <div class="login-form-group">
                <label for="password" class="login-label">Contraseña</label>
                <input type="password" id="password" name="password" class="login-input" required>
            </div>            
            <button type="submit" class="login-btn">Iniciar Sesión</button>

        <div class="login-demo-credentials">
            <p>Credenciales de demostración:<br>Usuario: <strong>admin</strong> | Contraseña: <strong>admin123</strong></p>
        </div>
        
        <p class="login-copyright">© A&D 2025</p>
    </div>
</body>
</html>
