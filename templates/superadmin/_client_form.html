<form method="POST">
    <div class="mb-3">
        <label for="name" class="form-label">Nombre del Cliente</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ client.name if client else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ client.email if client else '' }}">
    </div>
    <div class="mb-3">
        <label for="phone" class="form-label">Teléfono</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ client.phone if client else '' }}">
    </div>
    <div class="mb-3">
        <label for="address" class="form-label">Dirección</label>
        <textarea class="form-control" id="address" name="address" rows="3">{{ client.address if client else '' }}</textarea>
    </div>
    <div class="mb-3">
        <label for="business_type_id" class="form-label">Tipo de Negocio</label>
        <select class="form-select" id="business_type_id" name="business_type_id">
            <option value="">Selecciona un tipo...</option>
            {% for bt in business_types %}
                <option value="{{ bt.id }}" {% if client and client.business_type_id == bt.id %}selected{% endif %}>
                    {{ bt.name }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if client and client.is_active or not client %}checked{% endif %}>
        <label class="form-check-label" for="is_active">
            Cliente Activo
        </label>
    </div>
    <hr>
    <a href="{{ url_for('superadmin.manage_clients') }}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-primary">{{ 'Guardar Cambios' if client else 'Crear Cliente' }}</button>
</form>
