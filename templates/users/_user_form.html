<form method="POST">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ user.username if user else '' }}" required {% if user %}disabled{% endif %}>
                {% if user %}
                    <div class="form-text">El nombre de usuario no se puede cambiar.</div>
                {% endif %}
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ user.email if user else '' }}" required>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label for="first_name" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="first_name" name="first_name" value="{{ user.first_name if user else '' }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label for="last_name" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="last_name" name="last_name" value="{{ user.last_name if user else '' }}">
            </div>
        </div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" {% if not user %}required{% endif %}>
        {% if user %}
            <div class="form-text">Deja este campo en blanco si no quieres cambiar la contraseña.</div>
        {% endif %}
    </div>
    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="is_active" name="is_active" value="1" {% if user and user.is_active or not user %}checked{% endif %}>
        <label class="form-check-label" for="is_active">
            Usuario Activo
        </label>
    </div>
    <hr>
    <a href="{{ url_for('users.manage_users') }}" class="btn btn-secondary">Cancelar</a>
    <button type="submit" class="btn btn-primary">{{ 'Guardar Cambios' if user else 'Crear Usuario' }}</button>
</form>
